<!doctype html>
<html><head><meta charset="utf-8"><title>toLowerCase walk 2</title></head>
<body><h1>toLowerCase walk 2</h1><p id="s">starting</p>
<script>
// What the first walk missed.
//
// lowertest.html used String.fromCharCode, which only reaches U+FFFF, so it
// never tried a surrogate pair -- and x.com is full of emoji. It also only
// ever handed ICU a string of one or nine code units, while V8's
// LocaleConvertCase has a two-pass path that only runs when the result is
// longer than the input, and ustrcase_mapWithOverlap switches from a 300-unit
// stack buffer to uprv_malloc above that length.
//
// So: astral code points, long strings, and lone surrogates, each reporting
// the last thing that came back so a crash names what it was doing.
var phase = 0, cp = 0x10000, done = '(none)';
function mark(m) {
  done = m;
  document.getElementById('s').textContent = m;
  document.title = m;
}
function step() {
  var i, s;
  if (phase === 0) {
    // Astral plane, 256 code points at a time.
    var end = Math.min(cp + 256, 0x110000);
    while (cp < end) {
      try {
        s = String.fromCodePoint(cp);
        s.toLowerCase(); s.toUpperCase();
        ('aaaa' + s + 'bbbb').toLowerCase();
      } catch (e) { }
      cp++;
    }
    mark('astral last U+' + (cp - 1).toString(16).toUpperCase());
    if (cp >= 0x110000) { phase = 1; }
  } else if (phase === 1) {
    // Long strings: above ustrcase's 300-unit stack buffer, and around it.
    var lens = [64, 150, 299, 300, 301, 512, 1024, 4096, 20000];
    for (i = 0; i < lens.length; i++) {
      var n = lens[i];
      // Two-byte content, with characters whose lowercase is longer than
      // their uppercase and vice versa.
      var unit = 'İẞﬀΣAß😀';
      s = '';
      while (s.length < n) s += unit;
      s = s.substr(0, n);
      try { s.toLowerCase(); } catch (e) { }
      try { s.toUpperCase(); } catch (e) { }
      mark('length ' + n + ' ok');
    }
    phase = 2;
  } else if (phase === 2) {
    // Lone surrogates, which are legal in a JS string and not legal UTF-16.
    for (i = 0xD800; i < 0xE000; i++) {
      try {
        s = String.fromCharCode(i);
        s.toLowerCase(); s.toUpperCase();
        ('x' + s + 'y').toLowerCase();
        (s + s).toUpperCase();
      } catch (e) { }
    }
    mark('lone surrogates ok');
    phase = 3;
  } else {
    mark('ALL DONE (' + done + ')');
    return;
  }
  setTimeout(step, 0);
}
setTimeout(step, 100);
</script>
</body></html>
