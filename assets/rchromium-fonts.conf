<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig configuration for R Chromium on Haiku.

  Chromium bundles its own fontconfig (third_party/fontconfig) and looks for a
  config at the Linux default path, which Haiku does not have. Pointing it at
  Haiku's own /boot/system/settings/fonts/fonts.conf instead crashes inside
  FcCharSetSubtractCount: that file is written for the system fontconfig
  (2.17 / 2.18) and pulls in conf.d fragments and a DTD the bundled copy does
  not agree with.

  So give the bundled copy the only thing it actually needs: where the fonts
  are, and where it may cache. Nothing else.
-->
<fontconfig>
  <dir>/boot/system/data/fonts/ttfonts</dir>
  <dir>/boot/system/data/fonts/otfonts</dir>
  <dir>/boot/home/config/non-packaged/data/fonts</dir>

  <cachedir>/boot/home/config/cache/rchromium-fontconfig</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
